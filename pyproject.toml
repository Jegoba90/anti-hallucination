[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "antihallucination"
dynamic = ["version"]
description = "Your numbers decide; the AI only writes. Every figure, direction and name an AI writes is checked against your data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "CryptoCapi" }]
keywords = ["llm", "hallucination", "guardrails", "fact-checking", "reports", "nlg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# The checks need nothing outside the standard library. httpx is for
# OpenAICompatibleWriter; Claude's SDK is the optional extra below.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
claude = ["anthropic>=2.8.0"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    # Pinned on purpose: ruff widens its default rules between releases.
    "ruff==0.14.9",
    "anthropic>=2.8.0",
]

[project.scripts]
antihallucination = "antihallucination.cli:main"

[project.urls]
Homepage = "https://github.com/Jegoba90/anti-hallucination"
Issues = "https://github.com/Jegoba90/anti-hallucination/issues"

[tool.setuptools.packages.find]
include = ["antihallucination*"]

[tool.setuptools.package-data]
antihallucination = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "antihallucination.__version__" }

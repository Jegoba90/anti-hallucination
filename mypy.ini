[mypy]
# Strict, and no explicit Any: the package is typed for whoever imports it
# (antihallucination/py.typed), so its own code holds to the same bar.
# No python_version is pinned: CI runs mypy under 3.11, 3.13 and 3.14.
# A local build leaves a copy of the package in build/; skip it and the venvs.
exclude = (^|/)(build|dist|\.venv|venv)/
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
strict_optional = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
extra_checks = True
disallow_any_explicit = True

# The tests load JSON fixtures and index raw trees; requiring production
# narrowing there would only add noise. Needs tests/__init__.py to match.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
disallow_any_generics = False
warn_return_any = False

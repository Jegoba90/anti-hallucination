name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with the development extras
        run: pip install -e ".[dev]"

      # No network and no API key: every test runs on fixtures and stand-ins.
      - name: Run tests
        run: pytest tests/ -v

      - name: Check types
        run: mypy .

      - name: Lint
        run: ruff check .

  # Only what `pip install` brings. The Anthropic SDK is an extra, so the
  # Claude writer's tests skip here and every other test must pass without it.
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the package alone
        run: pip install . pytest

      - name: Run tests
        run: pytest tests/ -q

  # The wheel a user installs, run from outside the source tree: a module left
  # out of the package or a missing command fails here and not on a user.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: pip wheel . --no-deps -w dist

      - name: Install it in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl

      - name: Run the command line from outside the repository
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -c "import antihallucination; print(antihallucination.__version__, antihallucination.__file__)"
          set +e
          /tmp/venv/bin/antihallucination verify "$GITHUB_WORKSPACE/examples/saas/written_by_an_ai.txt" \
            --data "$GITHUB_WORKSPACE/examples/saas/data.json"
          status=$?
          set -e
          # 1: the example's invented figures were caught, as it is meant to show.
          test "$status" -eq 1

      # The command an MCP client launches, from the installed wheel with the
      # [mcp] extra, driven over stdio by the SDK's own client.
      - name: Serve over MCP from the installed package
        working-directory: /tmp
        run: |
          /tmp/venv/bin/pip install "antihallucination[mcp] @ file://$(ls $GITHUB_WORKSPACE/dist/*.whl)"
          /tmp/venv/bin/python - <<'PY'
          import asyncio
          from mcp import Client, StdioServerParameters

          async def main():
              server = StdioServerParameters(command="/tmp/venv/bin/antihallucination-mcp")
              async with Client(server) as client:
                  tools = sorted(tool.name for tool in (await client.list_tools()).tools)
                  print(tools)
                  assert tools == ["check_receipt", "compose_report", "prepare_report", "verify_text"], tools

          asyncio.run(asyncio.wait_for(main(), 60))
          PY

  # The image a company runs, built from this commit and called the way a
  # client calls it: no start without a token, the checks with one.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t anti-hallucination .

      - name: Refuse to start without a token
        run: |
          set +e
          docker run --rm anti-hallucination
          status=$?
          set -e
          test "$status" -eq 2

      - name: Serve with a token and call it
        env:
          TOKEN: ci-token-0123456789abcdef
        run: |
          docker run -d --name service -p 8000:8000 -e ANTIHALLUCINATION_TOKEN="$TOKEN" anti-hallucination
          for attempt in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/verify)" = 401
          python3 - <<'PY'
          import json, os, urllib.request

          data = json.load(open("examples/saas/data.json"))
          text = open("examples/saas/written_by_an_ai.txt").read()
          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/verify",
              data=json.dumps({"text": text, "data": data}).encode(),
              headers={"Content-Type": "application/json", "Authorization": "Bearer " + os.environ["TOKEN"]},
          )
          report = json.load(urllib.request.urlopen(request, timeout=30))
          print(report["text"])
          spans = {finding["span"] for sentence in report["sentences"] for finding in sentence["findings"]}
          assert {"8%", "49,000"} <= spans, spans
          assert report["text"] == "MRR was 48,200 USD (+6.1%). Churn fell to 2.3%. 37 new customers joined."
          PY

      - name: Service logs
        if: always()
        run: docker logs service || true
